  <text x="800" y="698" text-anchor="middle" font-size="16" fill="#5b5f73">A vitals chip on the cluster · rim and cabin light</text><text x="800" y="721" text-anchor="middle" font-size="16" fill="#5b5f73">one spoken prompt · thumb keys on the wheel · a trip heat map</text>

  <rect x="60" y="150" width="340" height="250" rx="26" fill="#fff" stroke="#e3e1ec" stroke-width="2" filter="url(#s)"/>
  <circle cx="112" cy="206" r="26" fill="#a9d8ea"/>
  <text x="112" y="214" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2233">N</text>
  <text x="152" y="200" font-size="24.0" font-weight="700" fill="#1f2233">Driver, Nadia</text>
  <text x="152" y="226" font-size="16.0" fill="#5b5f73">the long-haul highway driver</text>
  <text x="88" y="282" font-size="17" fill="#3d4052">• 3–4 hours after a day's work</text>
  <text x="88" y="312" font-size="17" fill="#3d4052">• Glances, never reads at speed</text>
  <text x="88" y="342" font-size="17" fill="#3d4052">• Answers by touch on the wheel</text>
  <text x="88" y="372" font-size="17" fill="#3d4052">• Pulls over when it matters</text>
  <rect x="60" y="520" width="340" height="250" rx="26" fill="#fff" stroke="#e3e1ec" stroke-width="2" filter="url(#s)"/>
  <circle cx="112" cy="576" r="26" fill="#e7c77a"/>
  <text x="112" y="584" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2233">R</text>
  <text x="152" y="570" font-size="24.0" font-weight="700" fill="#1f2233">The road</text>
  <text x="152" y="596" font-size="15.9" fill="#5b5f73">traffic, weather, time of day</text>
  <text x="88" y="652" font-size="17" fill="#3d4052">• Cut-ins and tailgating</text>
  <text x="88" y="682" font-size="17" fill="#3d4052">• Heavy traffic raises stress</text>
  <text x="88" y="712" font-size="17" fill="#3d4052">• Night driving and glare</text>
  <rect x="1200" y="150" width="340" height="250" rx="26" fill="#fff" stroke="#e3e1ec" stroke-width="2" filter="url(#s)"/>
  <text x="1228" y="200" font-size="24.0" font-weight="700" fill="#1f2233">Vehicle sensors</text>
  <text x="1228" y="226" font-size="16.0" fill="#5b5f73">what the car can read</text>
  <text x="1228" y="282" font-size="17" fill="#3d4052">• IR camera: eyes, gaze, head</text>
  <text x="1228" y="312" font-size="17" fill="#3d4052">• Wheel grip and pulse</text>
  <text x="1228" y="342" font-size="17" fill="#3d4052">• Skin conductance</text>
  <text x="1228" y="372" font-size="17" fill="#3d4052">• Steering and speed</text>
  <rect x="1200" y="520" width="340" height="250" rx="26" fill="#fff" stroke="#e3e1ec" stroke-width="2" filter="url(#s)"/>
  <text x="1228" y="570" font-size="24.0" font-weight="700" fill="#1f2233">Cabin and displays</text>
  <text x="1228" y="596" font-size="16.0" fill="#5b5f73">how it answers</text>
  <text x="1228" y="652" font-size="17" fill="#3d4052">• Instrument cluster</text>
  <text x="1228" y="682" font-size="17" fill="#3d4052">• Centre display</text>
  <text x="1228" y="712" font-size="17" fill="#3d4052">• Rim and cabin light</text>
  <text x="1228" y="742" font-size="17" fill="#3d4052">• Voice and wheel haptics</text>

  <path d="M402 245H496" stroke="#5b5f73" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="449" y="217" text-anchor="middle" font-size="15" fill="#5b5f73">face, grip,</text><text x="449" y="235" text-anchor="middle" font-size="15" fill="#5b5f73">pulse</text>
  <path d="M496 305H404" stroke="#5b5f73" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="449" y="330" text-anchor="middle" font-size="15" fill="#5b5f73">light, voice,</text><text x="449" y="349" text-anchor="middle" font-size="15" fill="#5b5f73">haptics</text>
  <path d="M230 518V404" stroke="#5b5f73" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#a)"/><text x="244" y="466" text-anchor="start" font-size="15" fill="#5b5f73">stress, fatigue</text>
  
  <path d="M1198 245H1104" stroke="#5b5f73" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="1151" y="235" text-anchor="middle" font-size="15" fill="#5b5f73">signals in</text>
  
  
  
  <path d="M1104 645H1196" stroke="#5b5f73" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#a)"/><text x="1151" y="632" text-anchor="middle" font-size="14" fill="#5b5f73">cues out</text>

  <g font-size="17" fill="#3d4052">
    <rect x="60" y="850" width="460" height="150" rx="22" fill="#f3f1fb"/><text x="88" y="890" font-size="20" font-weight="700" fill="#1f2233">Cloud, OTA and privacy</text><text x="88" y="924">Software updates in</text><text x="88" y="952">No footage leaves the car</text><text x="88" y="980">Processed on the car</text>
    <rect x="570" y="850" width="460" height="150" rx="22" fill="#f3f1fb"/><text x="598" y="890" font-size="20" font-weight="700" fill="#1f2233">The rules</text><text x="598" y="924">EU GSR</text><text x="598" y="952">Euro NCAP 2026</text><text x="598" y="980">NHTSA</text>
    <rect x="1080" y="850" width="460" height="150" rx="22" fill="#f3f1fb"/><text x="1108" y="890" font-size="20" font-weight="700" fill="#1f2233">The research</text><text x="1108" y="924">Human factors and ergonomics</text><text x="1108" y="952">A heuristic review of the screens</text><text x="1108" y="980">A map of where competitors sit</text>
  </g>
