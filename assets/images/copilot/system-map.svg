  <text x="800" y="279" text-anchor="middle" font-size="16" fill="#0f8f7a">both sensors agree</text>
  <text x="924" y="405" text-anchor="end" font-size="16" fill="#0f8f7a">tiredness</text><text x="924" y="425" text-anchor="end" font-size="16" fill="#0f8f7a">persists</text>
  <text x="800" y="625" text-anchor="middle" font-size="16" fill="#0f8f7a">it turns critical</text>
  <text x="676" y="490" text-anchor="start" font-size="16" fill="#0f8f7a">she rests,</text><text x="676" y="510" text-anchor="start" font-size="16" fill="#0f8f7a">it resets</text>
  <text x="800" y="452" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2233">The escalation loop</text>
