<!doctype html>
<!-- Dev-only: the Co-Pilot cockpit demos. A slow camera over the realistic mockups (shots/copilot/cockpit.jpg and emergency.jpg,
     1672 × 941, both the same Tata wheel), with highlights and annotations drawn on top and a caption per beat. cockpit.mjs captures it
     frame by frame. Every number in the captions comes from the Glance and reach zones and Interaction ergonomics boards in the Figma file. -->
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600&display=swap" />
        <style>
            html, body { margin: 0; overflow: hidden; background: #0b0d12; font-family: "Mona Sans", system-ui, sans-serif; }
            #view { position: relative; width: 1600px; height: 900px; overflow: hidden; }
            #world { position: absolute; left: 0; top: 0; width: 1672px; height: 941px; transform-origin: 0 0; }
            #world img { position: absolute; left: 0; top: 0; width: 1672px; height: 941px; }
            .fx { position: absolute; pointer-events: none; }
            .ring { border-radius: 50%; border: 2.5px solid var(--c); box-shadow: 0 0 18px var(--c); }
            .glow { border-radius: 50%; background: radial-gradient(circle, var(--c) 0, transparent 70%); mix-blend-mode: screen; }
            .box { border-radius: 14px; border: 2.5px solid var(--c); box-shadow: 0 0 22px var(--c), inset 0 0 14px color-mix(in srgb, var(--c) 40%, transparent); }
            #cap { position: absolute; left: 48px; bottom: 44px; max-width: 760px; display: flex; flex-direction: column; gap: 8px; padding: 18px 22px 20px; border-radius: 18px;
                   background: rgba(12, 14, 20, 0.62); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.14); color: #fff; }
            #cap small { font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #ffb547; }
            #cap b { font-size: 27px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
            #dots { position: absolute; right: 48px; bottom: 52px; display: flex; gap: 8px; }
            #dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
            #dots i.on { background: #ffb547; }
        </style>
    </head>
    <body>
        <div id="view">
            <div id="world"><img id="img" /></div>
            <div id="cap"><small></small><b></b></div>
            <div id="dots"></div>
        </div>
        <script>
            const AMBER = "#ffb547", TEAL = "#29e0c0"
            // beats: camera [cx, cy, zoom] held from t0 to t1 (the move into it eases over the first `move` seconds),
            // a caption, and effects: [kind, x, y, w, h, colour, delay] drawn in image pixels
            const SCENES = {
                "cp-cockpit": {
                    img: "shots/copilot/cockpit.jpg",
                    beats: [
                        { t: 3.2, cam: [836, 470, 1], tag: "On the Pune–Bangalore highway", cap: "The co-pilot lives where the driver already looks and holds: the road, the cluster and the wheel.", fx: [] },
                        { t: 4.2, cam: [770, 430, 1.75], tag: "Rim light", cap: "Driver state glows at the top of the rim, in peripheral vision. No glance needed.", fx: [["breathe", 790, 408, 190, 40, AMBER, 0.4]] },
                        { t: 4.2, cam: [800, 560, 1.6], tag: "Grip sensing", cap: "Grip zones on the rim read heart rate and skin conductance. Either hand is enough.", fx: [["pulse", 632, 548, 70, 70, TEAL, 0.3], ["pulse", 948, 512, 70, 70, TEAL, 0.9], ["pulse", 988, 652, 60, 60, TEAL, 1.5]] },
                        { t: 4.2, cam: [748, 548, 2.1], tag: "Cluster", cap: "State sits within 15° of the road view: one glance of 1.5 s or less, as icon plus a short label.", fx: [["box", 784, 543, 92, 70, TEAL, 0.4]] },
                        { t: 4.2, cam: [830, 625, 1.8], tag: "Thumb keys", cap: "Accept and Later sit under the thumbs, so a prompt is answered without looking away.", fx: [["press", 722, 637, 46, 46, TEAL, 0.6], ["press", 941, 602, 46, 46, TEAL, 2.0]] },
                        { t: 3.4, cam: [836, 470, 1], tag: "Eyes forward, hands on", cap: "Every cue is read in the periphery or felt in the hands, never only in a menu.", fx: [["breathe", 790, 408, 190, 40, AMBER, 0.2]] },
                    ],
                },
                // the ergonomics walk-through, on the same Tata cockpit as the other two films, with the board's annotations drawn live
                "cp-ergonomics": {
                    img: "shots/copilot/cockpit.jpg",
                    beats: [
                        { t: 3.2, cam: [836, 470, 1], tag: "Car and wheel ergonomics", cap: "One driver, one wheel: what she sees, what she presses, and what the wheel feels.", fx: [] },
                        { t: 5.0, cam: [970, 360, 1.4], tag: "Driver eye view", cap: "The critical cue sits within 5° of the road. A single glance is designed to stay under 1.5 s.", fx: [
                            ["cone", 1288, 300, 652, 342, 22, AMBER, 0.2],
                            ["hudcard", 652, 336, 0, 0, AMBER, 0.9],
                            ["callout", 652, 318, 700, 200, "5° · near-forward critical zone", "core alert only · ≤1.5 s glance target", AMBER, 1.3] ] },
                        { t: 4.8, cam: [930, 450, 1.45], tag: "Cluster viewing zone", cap: "Key driving info and alerts stay within 15° of the line of sight, under 30° down.", fx: [
                            ["cone", 1288, 300, 780, 545, 64, AMBER, 0.2],
                            ["box", 784, 543, 92, 70, AMBER, 0.9],
                            ["callout", 830, 520, 980, 560, "15° · cluster viewing zone", "key driving info + alert", AMBER, 1.3] ] },
                        { t: 5.0, cam: [835, 615, 1.9], tag: "Steering wheel interaction", cap: "Accept is convex, Later is concave and ridged: different place, shape and feel, under the thumbs.", fx: [
                            ["later", 940, 601, 0, 0, AMBER, 0],
                            ["press", 722, 637, 44, 44, AMBER, 0.7],
                            ["press", 940, 601, 40, 40, AMBER, 2.4],
                            ["callout", 722, 637, 600, 690, "Accept", "convex, physical key · positive action", AMBER, 0.5],
                            ["callout", 940, 601, 975, 650, "Later", "concave, ridged key · defer, not dismiss", AMBER, 2.2] ] },
                        { t: 5.0, cam: [800, 560, 1.55], tag: "Steering wheel sensing", cap: "Grip zones at about 8–11 and 1–4 o'clock sense passively. Haptics stay subtle, and escalate only if needed.", fx: [
                            ["pulse", 632, 548, 70, 70, AMBER, 0.3],
                            ["pulse", 948, 512, 66, 66, AMBER, 0.6],
                            ["wave", 615, 610, 60, 60, AMBER, 1.6],
                            ["wave", 960, 545, 60, 60, AMBER, 1.6],
                            ["callout", 632, 548, 440, 470, "Grip sensing zone", "approx. 8–11 o'clock · either hand is enough", AMBER, 0.6],
                            ["callout", 948, 512, 1000, 440, "Grip sensing zone", "approx. 1–4 o'clock · passive, no glance", AMBER, 0.9] ] },
                        { t: 4.0, cam: [1120, 470, 1.2], tag: "Natural driving posture", cap: "Upright, with relaxed shoulders. Every cue is seen or reached from here, without leaning in.", fx: [
                            ["callout", 1400, 560, 1180, 640, "Natural driving posture", "upright, relaxed shoulders", AMBER, 0.4] ] },
                        { t: 3.4, cam: [836, 470, 1], tag: "Eyes-free by design", cap: "Nothing has to be read to be noticed, or looked at to be answered.", fx: [["breathe", 790, 408, 190, 40, AMBER, 0.2]] },
                    ],
                },
                // the high-alert scenario, on the realistic critical-state mockup (shots/copilot/emergency.jpg, the same Tata wheel):
                // the rim flashing 3–4 times a second, the dashboard strip pulsing with it, then cluster, centre screen, camera and hands
                "cp-emergency": {
                    img: "shots/copilot/emergency.jpg",
                    layers: [
                        ["flash", 840, 420, 200, 36, "#ff3b4e", 0.2],
                        ["strip", [[0, 792], [300, 762], [640, 716]], 0, 0, 0, "#ff3b4e", 0.2],
                    ],
                    beats: [
                        { t: 3.6, cam: [836, 470, 1], tag: "High alert", cap: "Eyes have been closing for longer, and it hasn't eased. The co-pilot moves to its highest level.", fx: [] },
                        { t: 4.8, cam: [850, 490, 1.9], tag: "Rim and cluster", cap: "The rim flashes 3–4 times a second at the edge of vision. The cluster shows a warning shape and three words: Take a break.", fx: [["box", 892, 545, 92, 74, "#ff3b4e", 0.5]] },
                        { t: 4.8, cam: [300, 600, 1.85], tag: "One decision", cap: "Driver fatigue detected, at 93% confidence. The screen offers two equal actions: Take a break, or Later.", fx: [["pulse", 285, 562, 36, 36, "#ff3b4e", 0.4], ["box", 270, 668, 114, 40, "#ff3b4e", 1.4], ["box", 374, 661, 82, 36, "#ffffff", 2.2]] },
                        { t: 4.6, cam: [480, 600, 2.3], tag: "Why it's sure", cap: "The IR camera sees the eyes closing for longer. It leads, and the grip sensors in the wheel corroborate.", fx: [["box", 497, 600, 112, 136, "#ff3b4e", 0.4]] },
                        { t: 5.0, cam: [850, 610, 1.55], tag: "Hands on the wheel", cap: "The grip zones pulse under both hands, and the thumb keys answer the prompt without letting go.", fx: [["wave", 660, 560, 76, 76, "#ff3b4e", 0.3], ["wave", 1010, 540, 76, 76, "#ff3b4e", 0.3], ["press", 742, 655, 44, 44, "#ffffff", 2.2]] },
                        { t: 4.2, cam: [330, 740, 1.6], tag: "Across the cabin", cap: "The dashboard strip carries the same red rhythm, so the alert is felt across the whole cockpit.", fx: [] },
                        { t: 3.8, cam: [836, 470, 1], tag: "Eyes forward", cap: "One press on Accept takes the break: guidance to the nearest safe stop follows. The driver never has to look for it.", fx: [] },
                    ],
                },
                // the calm nudges, on the hi-fi boards S3 and S4 (shots/copilot/s3-drowsy.png, s4-tense.png, 2004 × 1179, from Figma)
                "cp-nudge-drowsy": {
                    img: "shots/copilot/s3-drowsy.png", w: 2004, h: 1179, tagColor: "#ffc21f",
                    beats: [
                        { t: 3.4, cam: [1002, 590, 1], tag: "Drowsy: the co-pilot steps in", cap: "Tiredness is building, but nothing flashes yet. The co-pilot nudges first.", fx: [["bar", 122, 1880, 1022, "#ffc21f", 0.3]] },
                        { t: 5.0, cam: [590, 590, 1.65], tag: "A place to stop", cap: "It finds the nearest rest stop: Hillview Rest Area, 2.4 km away, with coffee and restrooms.", fx: [["route", [[242, 848], [242, 740], [625, 740], [625, 560], [945, 560], [945, 378]], "#ffc21f", 0.3, 2.6], ["box", 775, 451, 312, 96, "#ffc21f", 2.8]] },
                        { t: 4.6, cam: [1540, 420, 1.75], tag: "One gentle question", cap: "You look tired. Want me to take you there? The voice asks once, then waits.", fx: [] },
                        { t: 4.8, cam: [1540, 610, 1.85], tag: "Why I am asking", cap: "The reason sits one line away: the eyes are closing more, and the heart rate has dropped.", fx: [["box", 1540, 600, 652, 152, "#ffc21f", 0.4]] },
                        { t: 4.8, cam: [1440, 770, 1.75], tag: "Two equal answers", cap: "Take me or Not now: on the screen, in one word, or with the Accept and Later keys on the wheel.", fx: [["press", 1325, 747, 200, 96, "#ffffff", 0.8]] },
                        { t: 3.6, cam: [1002, 590, 1], tag: "Cabin light", cap: "The cabin light turns cooler and brighter while the offer stands. No alarm, no repeat nagging.", fx: [["bar", 122, 1880, 1022, "#ffc21f", 0.2]] },
                    ],
                },
                "cp-nudge-tense": {
                    img: "shots/copilot/s4-tense.png", w: 2004, h: 1179, tagColor: "#b79cff",
                    beats: [
                        { t: 3.4, cam: [1002, 590, 1], tag: "Rising stress: a calm-down moment", cap: "Traffic is heavy and stress is rising. Instead of a warning, the co-pilot offers calm.", fx: [["breath", 622, 577, 145, 0, "#a98bf5", 0.2]] },
                        { t: 5.8, cam: [622, 577, 1.55], tag: "Breathe with the light", cap: "A breathing ring paces the driver, and the rim and cabin light pulse at the same slow pace.", fx: [["breath", 622, 577, 145, 0, "#a98bf5", 0]] },
                        { t: 4.4, cam: [420, 800, 1.9], tag: "Stress rising", cap: "Grip and heart rate show the stress building, so the offer arrives before it boils over.", fx: [["breath", 622, 577, 145, 0, "#a98bf5", 0], ["box", 300, 820, 340, 130, "#a98bf5", 0.4]] },
                        { t: 4.6, cam: [1540, 470, 1.75], tag: "One offer", cap: "Traffic is heavy. Want calmer music? It eases the music and holds calls while the driver breathes.", fx: [] },
                        { t: 4.6, cam: [1400, 670, 1.9], tag: "Yes, or not now", cap: "One tap, one word or one key says yes. Calls and pings wait until the moment passes.", fx: [["press", 1292, 642, 136, 96, "#ffffff", 0.8]] },
                        { t: 3.6, cam: [1002, 590, 1], tag: "Cabin light", cap: "The cabin light softens and dims. Nothing here asks the driver to look away for long.", fx: [["breath", 622, 577, 145, 0, "#a98bf5", 0], ["bar", 122, 1880, 1022, "#a98bf5", 0.2]] },
                    ],
                },
                // the wheel, board by board: S1 sensing, S9 grip pads, S10 thumb actions (shots/copilot/s1-sensing.png, s9-grip.png,
                // s10-thumb.png, each 1684 × 1255, from Figma), side by side so the camera slides from one to the next
                "cp-wheel-boards": {
                    parts: [["shots/copilot/s1-sensing.png", 0, 0], ["shots/copilot/s9-grip.png", 1744, 0], ["shots/copilot/s10-thumb.png", 3488, 0]],
                    w: 5172, h: 1255, fit: 900 / 1255, tagColor: "#2fd6c0",
                    beats: [
                        { t: 3.8, cam: [842, 628, 1], tag: "S1 · Steering wheel sensing", cap: "The wheel itself senses: grip pads read the hands, and a rim light shows the driver's state.", fx: [["breathe", 842, 420, 620, 150, "#ffc21f", 0.2]] },
                        { t: 4.8, cam: [600, 760, 1.25], tag: "Rim colour", cap: "The rim colour follows the state: alert and steady, tense and rising, drowsy with heavy eyes. It is read at the edge of vision.", fx: [["box", 218, 1003, 212, 50, "#2fd6c0", 0.4], ["box", 450, 1003, 212, 50, "#a98bf5", 1.4], ["box", 720, 1003, 288, 50, "#ffc21f", 2.4]] },
                        { t: 4.6, cam: [2586, 628, 1], tag: "S9 · Grip zones and sensor pads", cap: "Pads sit where hands naturally rest, and are wide enough that any hand position still reads.", fx: [["pulse", 2318, 655, 80, 80, "#2fd6c0", 0.4], ["pulse", 2854, 655, 80, 80, "#2fd6c0", 0.9]] },
                        { t: 4.4, cam: [2586, 640, 1.35], tag: "Two signals", cap: "Both hands give two signals, so one loose hand still shows. The orange marks are the thumb zones.", fx: [["press", 2354, 590, 60, 44, "#ff9a3c", 0.4], ["press", 2817, 590, 60, 44, "#ff9a3c", 1.2]] },
                        { t: 4.2, cam: [4330, 628, 1], tag: "S10 · Thumb actions on the wheel", cap: "Three keys you can tell apart by touch: a mic key, a round Accept and a flat Later.", fx: [] },
                        { t: 4.4, cam: [4440, 640, 1.6], tag: "Accept · round, big", cap: "The right thumb presses once to confirm the rest-stop route.", fx: [["press", 4520, 572, 128, 128, "#ffffff", 0.6]] },
                        { t: 5.0, cam: [4330, 660, 1.45], tag: "Later · flat key, or say it", cap: "Later dismisses the prompt for now and is never penalised. Or press the voice key and say Yes or Later.", fx: [["press", 4519, 739, 128, 56, "#ffffff", 0.5], ["press", 4140, 572, 86, 86, "#ffffff", 2.3]] },
                        { t: 4.6, cam: [4330, 830, 1.4], tag: "Squeeze twice", cap: "Squeezing both grips twice acknowledges an alert, without looking or speaking.", fx: [["wave", 4150, 880, 110, 110, "#2fd6c0", 0.4], ["wave", 4512, 880, 110, 110, "#2fd6c0", 0.4]] },
                        { t: 3.6, cam: [4330, 628, 1], tag: "Eyes on the road", cap: "Every answer lives under the thumbs or in the grip, so the driver never has to look down.", fx: [] },
                    ],
                },
            }
            const MOVE = 1.3
            // CSS matrix3d that maps a w×h box onto four points (top-left, top-right, bottom-left, bottom-right)
            const adj = (m) => [m[4] * m[8] - m[5] * m[7], m[2] * m[7] - m[1] * m[8], m[1] * m[5] - m[2] * m[4], m[5] * m[6] - m[3] * m[8], m[0] * m[8] - m[2] * m[6], m[2] * m[3] - m[0] * m[5], m[3] * m[7] - m[4] * m[6], m[1] * m[6] - m[0] * m[7], m[0] * m[4] - m[1] * m[3]]
            const mm = (a, b) => { const c = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { let s = 0; for (let k = 0; k < 3; k++) s += a[3 * i + k] * b[3 * k + j]; c[3 * i + j] = s } return c }
            const mv = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]]
            const basis = (p) => { const m = [p[0][0], p[1][0], p[2][0], p[0][1], p[1][1], p[2][1], 1, 1, 1]; const v = mv(adj(m), [p[3][0], p[3][1], 1]); return mm(m, [v[0], 0, 0, 0, v[1], 0, 0, 0, v[2]]) }
            function quad(w, h, q) {
                const t = mm(basis([q[0], q[1], q[2], q[3]]), adj(basis([[0, 0], [w, 0], [0, h], [w, h]])))
                for (let i = 0; i < 9; i++) t[i] /= t[8]
                return `matrix3d(${t[0]},${t[3]},0,${t[6]},${t[1]},${t[4]},0,${t[7]},0,0,1,0,${t[2]},${t[5]},0,${t[8]})`
            }
            function layerEl(L, t) {
                const lt = t - L[L.length - 1]
                if (lt < 0) return ""
                const a = Math.min(1, lt / 0.5)
                if (L[0] === "screen") {
                    const [, src, iw, ih, crop, q] = L
                    const [cx, cy, cw, ch] = crop
                    return `<div class="fx" style="left:0;top:0;width:${cw}px;height:${ch}px;transform-origin:0 0;transform:${quad(cw, ch, q)};opacity:${a};background:url(${src}) ${-cx}px ${-cy}px/${iw}px ${ih}px no-repeat;border-radius:10px;box-shadow:0 0 60px rgba(255,59,78,.35)"></div>`
                }
                if (L[0] === "flash") {
                    const [, x, y, w, h, c] = L
                    const on = Math.sin(lt * 2 * Math.PI * 3.5) > -0.2 ? 1 : 0.25 // about 3.5 flashes a second
                    return `<div class="fx glow" style="left:${x - w / 2}px;top:${y - h}px;width:${w}px;height:${h * 2}px;--c:${c};opacity:${a * on};filter:blur(5px)"></div>`
                }
                if (L[0] === "strip") {
                    const pts = L[1], c = L[5]
                    const on = Math.sin(lt * 2 * Math.PI * 3.5) > -0.2 ? 1 : 0.3
                    return `<svg class="fx" style="left:0;top:0;overflow:visible" width="1672" height="941"><polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" opacity="${a * on * 0.85}" style="filter:blur(3px) drop-shadow(0 0 10px ${c})"/></svg>`
                }
                if (L[0] === "hud") {
                    const [, x, y, , , c] = L
                    const pulse = 0.75 + 0.25 * Math.sin(lt * 2 * Math.PI * 1.2)
                    return `<div class="fx" style="left:${x - 52}px;top:${y - 26}px;width:104px;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:rgba(40,6,10,.35);border:2px solid ${c};box-shadow:0 0 22px ${c};opacity:${a * pulse};color:#fff;font:600 13px/1 'Mona Sans',sans-serif"><svg width="22" height="20" viewBox="0 0 24 22"><path d="M12 2 23 20H1Z" fill="${c}"/><path d="M12 8v6M12 16.5v1" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>Pull over</div>`
                }
                return ""
            }
            const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)
            const lerp = (a, b, p) => a + (b - a) * p
            let S, starts, total
            const world = document.getElementById("world"), cap = document.getElementById("cap"), dots = document.getElementById("dots")

            // "<id>-card": the same film with no caption or dots, for the home page card, which crops the sides
            window.loadScene = async (id) => {
                const card = id.endsWith("-card")
                cap.style.display = dots.style.display = card ? "none" : ""
                S = SCENES[id.replace(/-card$/, "")]
                const img = document.getElementById("img")
                W = S.w || 1672
                H = S.h || 941
                FIT = S.fit || Math.max(1600 / W, 900 / H)
                // a scene can lay several boards out in a row (parts: [src, x, y]); the camera slides between them
                world.querySelectorAll(".part").forEach((n) => n.remove())
                img.style.display = S.parts ? "none" : ""
                if (S.parts) {
                    for (const [src, x, y] of S.parts) world.insertAdjacentHTML("beforeend", `<img class="part" src="${src}" style="position:absolute;left:${x}px;top:${y}px;width:auto;height:auto;border-radius:18px">`)
                    await Promise.all([...world.querySelectorAll(".part")].map((n) => n.decode()))
                }
                world.style.width = img.style.width = W + "px"
                world.style.height = img.style.height = H + "px"
                cap.querySelector("small").style.color = S.tagColor || ""
                if (!S.parts) img.src = S.img
                img.style.filter = S.dim ? `brightness(${S.dim}) saturate(0.9)` : ""
                if (!S.parts) await img.decode()
                await document.fonts.ready
                starts = []
                total = 0
                for (const b of S.beats) { starts.push(total); total += b.t }
                dots.innerHTML = S.beats.map(() => "<i></i>").join("")
                seek(0)
                return total
            }

            let W = 1672, H = 941, FIT = 1600 / 1672
            function camAt(t) {
                let i = starts.findLastIndex((s) => s <= t)
                if (i < 0) i = 0
                const b = S.beats[i], prev = S.beats[Math.max(0, i - 1)]
                const p = i === 0 ? 1 : ease(Math.min(1, (t - starts[i]) / MOVE))
                // a slow drift while holding, so the shot never freezes
                const hold = (t - starts[i]) / b.t
                const z = lerp(prev.cam[2], b.cam[2], p) * (1 + 0.025 * hold)
                return { i, x: lerp(prev.cam[0], b.cam[0], p), y: lerp(prev.cam[1], b.cam[1], p), z }
            }

            function fxEl(f, local) {
                if (f[0] === "route") {
                    // the way to the stop: a trail draws along the route, with a dot travelling on it
                    const [, pts, c, delay, dur] = f
                    const lt = local - delay
                    if (lt < 0) return ""
                    const segs = pts.slice(1).map((q, i) => Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]))
                    const total = segs.reduce((a, b) => a + b, 0)
                    let d = total * ease(Math.min(1, lt / dur)), x = pts[0][0], y = pts[0][1], done = [pts[0]]
                    for (let i = 0; i < segs.length; i++) {
                        if (d >= segs[i]) { d -= segs[i]; done.push(pts[i + 1]); x = pts[i + 1][0]; y = pts[i + 1][1] }
                        else { const k = d / segs[i]; x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k; y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k; done.push([x, y]); break }
                    }
                    return `<svg class="fx" style="left:0;top:0;overflow:visible" width="${W}" height="${H}"><polyline points="${done.map((q) => q.join(",")).join(" ")}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".75" style="filter:drop-shadow(0 0 10px ${c})"/><circle cx="${x}" cy="${y}" r="13" fill="#fff" style="filter:drop-shadow(0 0 12px ${c})"/><circle cx="${x}" cy="${y}" r="6" fill="${c}"/></svg>`
                }
                if (f[0] === "breath") {
                    // breathing pace: the ring swells and settles about every 5 s, with a soft wave going out each time
                    const [, x, y, r, , c, delay] = f
                    const lt = Math.max(0, local - delay) + 1000
                    const ph = 0.5 - 0.5 * Math.cos((lt * 2 * Math.PI) / 5)
                    const k = 0.92 + 0.14 * ph
                    let out = `<div class="fx" style="left:${x - r}px;top:${y - r}px;width:${r * 2}px;height:${r * 2}px;border-radius:50%;transform:scale(${k});box-shadow:0 0 ${40 + 50 * ph}px ${10 + 16 * ph}px color-mix(in srgb, ${c} 55%, transparent);opacity:.85"></div>`
                    const w = ((lt % 5) / 5)
                    out += `<div class="fx" style="left:${x - r}px;top:${y - r}px;width:${r * 2}px;height:${r * 2}px;border-radius:50%;border:2px solid ${c};transform:scale(${1 + w * 0.95});opacity:${(1 - w) * 0.5}"></div>`
                    return out
                }
                if (f[0] === "bar") {
                    const [, x1, x2, y, c, delay] = f
                    const lt = local - delay
                    if (lt < 0) return ""
                    const a = Math.min(1, lt / 0.6) * (0.55 + 0.45 * (0.5 - 0.5 * Math.cos((lt * 2 * Math.PI) / 3)))
                    return `<div class="fx" style="left:${x1}px;top:${y - 6}px;width:${x2 - x1}px;height:12px;border-radius:12px;background:${c};opacity:${a};filter:blur(6px);box-shadow:0 0 30px 8px ${c}"></div>`
                }
                if (f[0] === "cone") {
                    const [, ex, ey, tx, ty, half, c, delay] = f
                    const lt = local - delay
                    if (lt < 0) return ""
                    const p = ease(Math.min(1, lt / 1.1))
                    const x2 = ex + (tx - ex) * p, y2 = ey + (ty - ey) * p
                    const dx = tx - ex, dy = ty - ey, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L, h = half * p
                    const pts = `${ex},${ey} ${x2 + nx * h},${y2 + ny * h} ${x2 - nx * h},${y2 - ny * h}`
                    return `<svg class="fx" style="left:0;top:0;overflow:visible" width="1672" height="941"><defs><linearGradient id="cg${tx}" gradientUnits="userSpaceOnUse" x1="${ex}" y1="${ey}" x2="${tx}" y2="${ty}"><stop offset="0" stop-color="${c}" stop-opacity="0"/><stop offset="1" stop-color="${c}" stop-opacity=".38"/></linearGradient></defs><polygon points="${pts}" fill="url(#cg${tx})"/><polyline points="${x2 + nx * h},${y2 + ny * h} ${ex},${ey} ${x2 - nx * h},${y2 - ny * h}" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="6 5" opacity=".9"/></svg>`
                }
                if (f[0] === "callout") {
                    const [, ax, ay, bx, by, title, sub, c, delay] = f
                    const lt = local - delay
                    if (lt < 0) return ""
                    const a = Math.min(1, lt / 0.45)
                    const w = 236, h = 52, cx = Math.max(bx, Math.min(bx + w, ax)), cy = ay < by ? by : by + h
                    return `<svg class="fx" style="left:0;top:0;overflow:visible" width="1672" height="941"><line x1="${ax}" y1="${ay}" x2="${cx}" y2="${cy}" stroke="${c}" stroke-width="1.5" opacity="${a}"/><circle cx="${ax}" cy="${ay}" r="4" fill="${c}" opacity="${a}"/></svg>` +
                        `<div class="fx" style="left:${bx}px;top:${by}px;width:${w}px;padding:8px 11px 9px;box-sizing:border-box;border-radius:10px;background:rgba(14,15,20,.72);border:1.5px solid color-mix(in srgb, ${c} 70%, transparent);color:#fff;opacity:${a};transform:translateY(${(1 - a) * 6}px)"><div style="font:600 14px/1.2 'Mona Sans',sans-serif">${title}</div><div style="font:400 11px/1.3 'Mona Sans',sans-serif;color:#d9d6cf;margin-top:2px">${sub}</div></div>`
                }
                if (f[0] === "hudcard") {
                    const [, x, y, , , c, delay] = f
                    const lt = local - delay
                    if (lt < 0) return ""
                    const a = Math.min(1, lt / 0.5)
                    return `<div class="fx" style="left:${x - 74}px;top:${y - 14}px;width:148px;height:28px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;background:rgba(255,181,71,.18);border:1.5px solid ${c};box-shadow:0 0 14px ${c};opacity:${a};color:#fff;font:600 11.5px/1 'Mona Sans',sans-serif"><svg width="14" height="13" viewBox="0 0 24 22" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><path d="M3 9h14v5a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6z"/><path d="M17 11h2a3 3 0 0 1 0 6h-2M7 2v3M11 2v3"/></svg>Take a short break</div>`
                }
                if (f[0] === "later") {
                    // the right-hand thumb key, drawn as Later (a clock), as on the ergonomics board
                    const [, x, y] = f
                    return `<div class="fx" style="left:${x - 15}px;top:${y - 14}px;width:30px;height:28px;border-radius:7px;background:#23262c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.6);display:grid;place-items:center;transform:rotate(-8deg)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8e6e1" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>`
                }
                const [kind, x, y, w, h, c, delay] = f
                const lt = local - delay
                if (lt < 0) return ""
                const fadeIn = Math.min(1, lt / 0.4)
                const st = (left, top, ww, hh, extra = "") => `left:${left}px;top:${top}px;width:${ww}px;height:${hh}px;--c:${c};${extra}`
                if (kind === "breathe") {
                    // about 10–12 breaths a minute: one every ~5.5 s, sped up a little so it reads on video
                    const a = 0.35 + 0.65 * (0.5 - 0.5 * Math.cos(lt * 2 * Math.PI / 2.6))
                    return `<div class="fx glow" style="${st(x - w / 2, y - h, w, h * 2, `opacity:${fadeIn * a};filter:blur(6px)`)}"></div>`
                }
                if (kind === "pulse") {
                    const a = 0.5 + 0.5 * Math.sin(lt * 2 * Math.PI / 1.4)
                    return `<div class="fx glow" style="${st(x - w, y - h, w * 2, h * 2, `opacity:${fadeIn * (0.45 + 0.4 * a)}`)}"></div>` + `<div class="fx ring" style="${st(x - w / 2, y - h / 2, w, h, `opacity:${fadeIn * 0.9}`)}"></div>`
                }
                if (kind === "box") {
                    const a = 0.6 + 0.4 * Math.sin(lt * 2 * Math.PI / 1.6)
                    return `<div class="fx box" style="${st(x - w / 2, y - h / 2, w, h, `opacity:${fadeIn * a}`)}"></div>`
                }
                if (kind === "arc") {
                    const p = Math.min(1, lt / 1.2)
                    return `<svg class="fx" style="left:${x - w / 2}px;top:${y - h}px;overflow:visible" width="${w}" height="${h + 20}" viewBox="0 0 ${w} ${h + 20}"><path d="M4 ${h} Q ${w / 2} ${-h * 0.6} ${w - 4} ${h}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}" style="filter:drop-shadow(0 0 8px ${c})"/></svg>`
                }
                if (kind === "press") {
                    // a press: the key ring dips, then a ripple spreads (rounded like the button when it is wide)
                    const br = w / h > 1.4 ? "border-radius:22px;" : ""
                    let out = `<div class="fx ring" style="${st(x - w / 2, y - h / 2, w, h, `${br}opacity:${fadeIn};transform:scale(${lt < 0.25 ? 1 - lt * 0.5 : 0.88 + Math.min(0.12, (lt - 0.25) * 0.4)})`)}"></div>`
                    for (const k of [0, 0.35]) {
                        const r = (lt - k) % 1.6
                        if (r > 0 && r < 1.1) out += `<div class="fx ring" style="${st(x - w / 2, y - h / 2, w, h, `${br}opacity:${(1 - r / 1.1) * 0.8};transform:scale(${1 + r * (br ? 0.35 : 1.4)})`)}"></div>`
                    }
                    return out
                }
                if (kind === "wave") {
                    let out = ""
                    for (const k of [0, 0.45, 0.9]) {
                        const r = (lt - k) % 1.35
                        if (r > 0) out += `<div class="fx ring" style="${st(x - w / 2, y - h / 2, w, h, `opacity:${fadeIn * (1 - r / 1.35) * 0.85};transform:scale(${0.6 + r * 1.1})`)}"></div>`
                    }
                    return out
                }
                return ""
            }

            window.seek = (t) => {
                const c = camAt(t)
                const s = FIT * c.z
                // keep the camera inside the photo, so no black edge ever shows
                const hw = 800 / s, hh = 450 / s
                c.x = Math.min(W - hw, Math.max(hw, c.x))
                c.y = Math.min(H - hh, Math.max(hh, c.y))
                world.style.transform = `translate(${800 - c.x * s}px, ${450 - c.y * s}px) scale(${s})`
                const b = S.beats[c.i], local = t - starts[c.i]
                world.querySelectorAll(".fx").forEach((n) => n.remove())
                const after = Math.max(0, local - (c.i ? MOVE * 0.6 : 0))
                world.insertAdjacentHTML("beforeend", (S.layers || []).map((L) => layerEl(L, t)).join("") + b.fx.map((f) => fxEl(f, after)).join(""))
                cap.querySelector("small").textContent = b.tag
                cap.querySelector("b").textContent = b.cap
                // the caption fades between beats
                const out = b.t - local, a = Math.min(1, local / 0.45, out / 0.35)
                cap.style.opacity = Math.max(0, a)
                cap.style.transform = `translateY(${(1 - Math.min(1, local / 0.45)) * 10}px)`
                ;[...dots.children].forEach((d, k) => d.classList.toggle("on", k === c.i))
            }
        </script>
    </body>
</html>
